name: "GLaDOS 自动签到"
description: "GLaDOS / Railgun 自动签到 + 积分兑换（可配档位/签到时间）"
author: "Linsar"
icon: "antenna.radiowaves.left.and.right"

compat_arguments:
  exchangePoints: "100"
  checkinHour: "7"
  manualCookie: ""
  manualDomain: "glados.network"

compat_arguments_desc: |
  exchangePoints: 兑换积分档位（可选 100/200/500，默认 100）
  checkinHour: 签到时间（0-23，默认 7=早上7点）
  manualCookie: 手动添加 Cookie（粘贴完整 cookie 字符串）。填好后下次签到自动导入，导入成功后清空此项即可。
  manualDomain: 手动添加 Cookie 对应的域名（默认 glados.network）

  📌 首次使用（两种方式任选）：
  方式 A — 自动抓包：开启 MitM → 浏览器打开 https://glados.network/console/account 登录即可
  方式 B — 手动添加：在 manualCookie 粘贴 cookie → 等一次签到运行 → 清空 manualCookie

scriptings:
  - http_request:
      name: GLaDOS Cookie 抓包
      match: ^https://(glados\.network|railgun\.info|glados\.vip|glados\.one|glados\.space)/console/account$
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 10
  - schedule:
      name: GLaDOS 自动签到
      cron: "10 {{{checkinHour}}} * * *"
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 120

mitm:
  hostnames:
    includes:
      - glados.network
      - railgun.info
      - glados.vip
      - glados.one
      - glados.space

name: "GLaDOS 自动签到"
description: "GLaDOS / Railgun 自动签到 + 积分兑换 + NodeLoc / NodeSeek 自动阅读"
author: "Linsar"
icon: "antenna.radiowaves.left.and.right"

compat_arguments:
  exchangePoints: "100"
  checkinHour: "7"

compat_arguments_desc: |
  exchangePoints: 兑换积分档位（可选 100/200/500，默认 100）
  checkinHour: 签到时间（0-23，默认 7=早上7点）

  📌 首次使用：
  GLaDOS — 使用浏览器打开 https://glados.network/console/account 即可自动抓包
  NodeLoc — 点头像 → 摘要 → 账户即可自动抓包
  NodeSeek — 点头像 → 设置即可自动抓包

  多账号：同一域名重复登一次即可追加 Cookie。支持同时使用所有平台。

scriptings:
  - http_request:
      name: Cookie 抓包
      match: ^https://(glados\.network|railgun\.info|glados\.vip|glados\.one|glados\.space)/console/account$
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 10
  - http_request:
      name: NodeLoc Cookie 抓包
      match: ^https://www\.nodeloc\.com/(my/preferences|u/[^/]+/preferences/account)
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 10
  - http_request:
      name: NodeSeek Cookie 抓包
      match: ^https://nodeseek\.cc/(my/preferences|u/[^/]+/preferences/account)
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 10
  - schedule:
      name: GLaDOS 自动签到
      cron: "10 {{{checkinHour}}} * * *"
      script_url: https://raw.githubusercontent.com/Linsars/Surge/main/JS/glados.js
      timeout: 120

mitm:
  hostnames:
    includes:
      - glados.network
      - railgun.info
      - glados.vip
      - glados.one
      - glados.space
      - www.nodeloc.com
      - nodeseek.cc

name: "数据中心DCH"
description: "检测当前节点是否支持流媒体、AI、本地IP、落地IP、IP纯净度（6源）"
author: "Linsar"
icon: "globe.asia.australia.fill"

compat_arguments:
  POLICY: "DIRECT"
  IPREGISTRY_KEY: "tryout"
  IPQS_KEY: ""
  IPDATA_KEY: ""

compat_arguments_desc: |
  POLICY: 流媒体/IP检测请求走的策略组名称。DIRECT=直连（默认），或填策略组名。
  IPREGISTRY_KEY: ipregistry API Key（100,000积分免费）。注册：https://www.ipregistry.co
  IPQS_KEY: IPQualityScore API Key（5000次/月免费）。注册：https://www.ipqualityscore.com
  不填则使用默认试用 key。

rules:
  - domain_suffix:
      match: ipip.net
      policy: "DIRECT"
  - domain_suffix:
      match: 126.net
      policy: "DIRECT"
  - domain_suffix:
      match: my.ippure.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip-api.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: api.ipapi.is
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipinfo.io
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip.sb
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ippure.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip2location.io
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: db-ip.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipregistry.co
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipqualityscore.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipdata.co
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: chatgpt.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: openai.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: gemini.google.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: youtube.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: googlevideo.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: netflix.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: nflxvideo.net
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: tiktok.com
      policy: "{{{POLICY}}}"

scriptings:
  - generic:
      name: "数据中心DCH"
      script_url: "https://raw.githubusercontent.com/Linsars/Surge/main/JS/egern-ipDCH.js"
      timeout: 120

widgets:
  - name: "数据中心DCH"
    update_interval: 300
    env:
      POLICY: "{{{POLICY}}}"
      IPREGISTRY_KEY: "{{{IPREGISTRY_KEY}}}"
      IPQS_KEY: "{{{IPQS_KEY}}}"
      IPDATA_KEY: "{{{IPDATA_KEY}}}"

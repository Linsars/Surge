name: "数据中心DCH"
description: "检测当前节点是否支持流媒体、AI、本地IP、落地IP、IP纯净度"
author: "Linsar"
icon: "globe.asia.australia.fill"

compat_arguments:
  POLICY: "DIRECT"

env_schema:
  POLICY:
    name: 代理策略
    description: "用于流媒体/IP检测请求的策略组名称（如 PROXY、GLOBAL、你的节点组名等），DIRECT 表示直连"
    default_value: "DIRECT"

rules:
  # 落地 IP 检测
  - domain_suffix:
      match: my.ippure.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip-api.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: api.ipapi.is
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipinfo.io
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip.sb
      policy: "{{{POLICY}}}"
  # 流媒体解锁检测
  - domain_suffix:
      match: chatgpt.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: openai.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: gemini.google.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: youtube.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: googlevideo.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: netflix.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: nflxvideo.net
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: tiktok.com
      policy: "{{{POLICY}}}"

scriptings:
  - generic:
      name: "数据中心DCH"
      script_url: "https://raw.githubusercontent.com/Linsars/Surge/main/JS/egern-ipDCH.js"
      timeout: 120

widgets:
  - name: "数据中心DCH"
    update_interval: 300
    env:
      POLICY: "DIRECT"

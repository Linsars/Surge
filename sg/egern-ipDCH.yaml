name: "数据中心DCH"
description: "检测当前节点是否支持流媒体、AI、本地IP、落地IP、IP纯净度"
author: "Linsar"
icon: "globe.asia.australia.fill"

compat_arguments:
  POLICY: "DIRECT"

compat_arguments_desc: |
  POLICY: 流媒体/IP检测请求走的策略组名称。
  DIRECT = 直连（默认），PROXY = 代理，或填你自定义的节点组名。
  修改方式：在 Egern 的模块编辑页面 → 参数(compat_arguments) → POLICY 填入你的策略组名。
  小组件会自动显示此名称。

rules:
  # 落地 IP 检测
  - domain_suffix:
      match: my.ippure.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip-api.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: api.ipapi.is
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ipinfo.io
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ip.sb
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: ippure.com
      policy: "{{{POLICY}}}"
  # 流媒体解锁检测
  - domain_suffix:
      match: chatgpt.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: openai.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: gemini.google.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: youtube.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: googlevideo.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: netflix.com
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: nflxvideo.net
      policy: "{{{POLICY}}}"
  - domain_suffix:
      match: tiktok.com
      policy: "{{{POLICY}}}"

scriptings:
  - generic:
      name: "数据中心DCH"
      script_url: "https://raw.githubusercontent.com/Linsars/Surge/main/JS/egern-ipDCH.js"
      timeout: 120

widgets:
  - name: "数据中心DCH"
    update_interval: 300
    env:
      POLICY: "{{{POLICY}}}"
